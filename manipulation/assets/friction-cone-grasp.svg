<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="摩擦锥与对偶抓取的力封闭判据">
  <style>
    .bg{fill:#ffffff}
    .ob{fill:#eef1f4;stroke:#52606d;stroke-width:1.8}
    .ck{fill:#2f855a;fill-opacity:.20;stroke:#2f855a;stroke-width:1.2}
    .cx{fill:#c0392b;fill-opacity:.18;stroke:#c0392b;stroke-width:1.2}
    .nl{stroke:#52606d;stroke-width:1.3;stroke-dasharray:4 3}
    .t {font-family:'Fira Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#1f2933;text-anchor:middle}
    .ts{font-family:'Fira Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:11.5px;fill:#52606d;text-anchor:middle}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="340"/>

  <text class="t"  x="204" y="36">力封闭成立</text>
  <text class="ts" x="204" y="58">两接触点的连线同时落在两端摩擦锥内</text>
  <rect class="ob" x="150" y="100" width="108" height="144" rx="8"/>
  <path class="ck" d="M150,158 L199.2,135.8 A54,54 0 0 1 199.2,180.2 Z"/>
  <path class="ck" d="M258,181 L208.8,203.2 A54,54 0 0 1 208.8,158.8 Z"/>
  <line class="nl" x1="150" y1="158" x2="212" y2="158"/>
  <line class="nl" x1="258" y1="181" x2="196" y2="181"/>
  <line stroke="#2f855a" stroke-width="2.6" x1="150" y1="158" x2="258" y2="181"/>
  <circle cx="150" cy="158" r="5" fill="#2f855a"/>
  <circle cx="258" cy="181" r="5" fill="#2f855a"/>
  <text class="ts" x="204" y="272" fill="#2f855a">连线与法线夹角 12°，小于摩擦锥半角 24°</text>
  <text class="ts" x="204" y="292">接触力可落在锥内，能抵抗任意方向的扰动</text>

  <text class="t"  x="600" y="36">力封闭不成立</text>
  <text class="ts" x="600" y="58">连线偏离法线过多，超出摩擦锥</text>
  <rect class="ob" x="540" y="100" width="108" height="144" rx="8"/>
  <path class="cx" d="M540,124 L589.2,101.8 A54,54 0 0 1 589.2,146.2 Z"/>
  <path class="cx" d="M648,214 L598.8,236.2 A54,54 0 0 1 598.8,191.8 Z"/>
  <line class="nl" x1="540" y1="124" x2="602" y2="124"/>
  <line class="nl" x1="648" y1="214" x2="586" y2="214"/>
  <line stroke="#c0392b" stroke-width="2.6" x1="540" y1="124" x2="648" y2="214"/>
  <circle cx="540" cy="124" r="5" fill="#c0392b"/>
  <circle cx="648" cy="214" r="5" fill="#c0392b"/>
  <text class="ts" x="600" y="272" fill="#c0392b">连线与法线夹角 40°，大于摩擦锥半角 24°</text>
  <text class="ts" x="600" y="292">无论施加多大夹持力，接触点都会滑移</text>

  <text class="ts" x="410" y="326">虚线为接触面法线，扇形为摩擦锥，半角等于 arctan μ（此处 μ = 0.45，半角 24.2°）</text>
</svg>
