  <text class="ts" x="498" y="195.0" transform="rotate(-90 498,195.0)">深度分辨率 (mm)</text>
  <text class="ts" x="238.0" y="374">视差 d = xL - xR，与深度 Z 成反比</text>
  <text class="ts" x="665.0" y="374">f = 700 px，b = 60 mm，亚像素视差精度 0.25 px</text>
  <text class="ts" x="440" y="404">深度分辨率 ΔZ = Z² · δd / (f · b)：距离翻倍，误差变为四倍</text>
  <text class="ts" x="440" y="424">要在远处保持精度只能加长基线或增大焦距，但两者都会缩小近处可测范围与视场</text>
  <text class="ts" x="440" y="444">这正是双目方案在数米之外精度迅速劣化、需改用激光雷达的原因</text>
