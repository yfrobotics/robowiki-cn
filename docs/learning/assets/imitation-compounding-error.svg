  <text class="sl" x="710" y="156" fill="#b7791f">J = 38，降至约 1/8</text>
  <line x1="678" y1="170" x2="704" y2="170" stroke="#2f855a" stroke-width="2.4"/>
  <text class="lg" x="710" y="174">DAgger（专家在线纠正）</text>
  <text class="sl" x="710" y="190" fill="#2f855a">J = 3.6，双对数斜率 1.03</text>
  <text class="ts" x="440" y="404">曲线为 2000 次仿真滚动的平均。行为克隆的双对数斜率约 2，对应理论界 O(eps·T²)；DAgger 约为 1</text>
  <text class="ts" x="440" y="426">动作块把决策次数从 T 降到 T/H，本例中把累积代价压低了约一个数量级；它减小常数，不改变增长阶次</text>
  <text class="ts" x="440" y="448">这解释了为何抓取这类短任务容易做好，而几十步的长程任务成功率会骤降</text>
</svg>
