  <text class="lg" x="710" y="106">行为克隆（逐步决策）</text>
  <text class="sl" x="710" y="122" fill="#c0392b">J = 324，双对数斜率 2.18</text>
  <line x1="678" y1="136" x2="704" y2="136" stroke="#b7791f" stroke-width="2.4"/>
