    .cb{font-family:'Fira Sans','Noto Sans SC',sans-serif;font-size:13px;fill:#ffffff;text-anchor:middle}
  </style>
  <rect class="bg" x="0" y="0" width="584" height="516"/>
  <text class="t" x="292" y="34">A* 搜索：f(n) = g(n) + h(n)</text>
  <text class="ts" x="292" y="54">g 为起点到 n 的实际代价，h 为 n 到终点的启发估计（此处用曼哈顿距离）</text>
